[package]
name = "termismus"
version = "1.1.0"
description = "TERMISMUS - encrypted SSH vault with native terminals & cloud sync"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
rfd = "0.15"
arboard = { version = "3", default-features = false }

# local terminal (ConPTY on Windows)
portable-pty = "0.8"

# native SSH — no ssh.exe dependency
russh = "0.46"
russh-keys = "0.46"
russh-sftp = "2.4"
async-trait = "0.1"
hmac = "0.12"
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }

# cloud sync client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# NOTE: mobile targets (android/iOS) are not supported yet: portable-pty (ConPTY) and the local file browser are desktop-only.

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# only one running app; a second launch focuses the existing window
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = false
codegen-units = 16
strip = true
